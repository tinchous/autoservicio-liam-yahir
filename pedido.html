<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido | Autoservice Liam-Yahir</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/neon.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Autoservice Liam-Yahir" class="logo">
  </header>

  <main class="pedido-form">
    <h2>🧾 Finalizar Pedido</h2>
    <form id="form-pedido">
      <input id="nombre" placeholder="Tu nombre" required>
      <input id="email" type="email" placeholder="Tu correo" required>
      <input id="direccion" placeholder="Dirección de entrega" required>
      <button type="submit" class="neon-btn">Enviar pedido</button>
    </form>
  </main>

  <script type="module" src="js/pedido.js"></script>
</body>
</html>
