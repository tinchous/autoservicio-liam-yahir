<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | Autoservice Liam-Yahir</title>
  <link rel="stylesheet" href="css/neon.css" />
</head>

<body>
  <header class="header-bar">
    <div class="logo-area">
      <img src="images/logo.png" alt="Autoservice Liam-Yahir" class="logo-mini" />
      <h1>Autoservice <span>Liam-Yahir</span></h1>
    </div>
    <nav class="nav-menu">
      <a href="index.html">Inicio</a>
      <a href="products.html" class="activo">Catálogo</a>
      <a href="delivery.html">Delivery</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <a href="login.html" class="login-link">Ingresar / Registrar</a>
    </nav>
  </header>

  <main class="container" style="display:flex; gap:20px; align-items:flex-start; padding:20px;">
  <!-- SIDEBAR FILTROS (vertical) -->
  <aside id="sidebar-filtros" class="sidebar">
    <h3>Filtros</h3>
    <div class="filtro-block">
      <label>Categoría</label>
      <select id="filter-categoria">
        <option value="">Todas</option>
        <!-- Se llenará dinámicamente -->
      </select>
    </div>

    <div class="filtro-block">
      <label>Ordenar</label>
      <select id="filter-orden">
        <option value="default">Por defecto</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="precio-asc">Precio ↑</option>
        <option value="precio-desc">Precio ↓</option>
        <option value="ofertas">Ofertas</option>
      </select>
    </div>

    <div style="margin-top:12px;">
      <button id="btn-limpiar-filtros" class="btn">Limpiar filtros</button>
    </div>
  </aside>

  <!-- ZONA DE PRODUCTOS -->
  <section style="flex:1;">
    <h2 class="titulo-seccion">Catálogo Completo</h2>
    <div id="productos" class="grid"></div>
  </section>
</main>

<!-- Contenedor del carrito flotante -->
<div class="carrito-flotante" id="carrito"></div>

<!-- WhatsApp flotante -->
<a href="https://wa.me/59892308828" class="whatsapp-float" target="_blank">
  <img src="images/icons/whatsapp-icon.png" alt="WhatsApp">
</a>


  <footer class="footer-neon">
    <p>© 2025 Autoservice Liam-Yahir · Todos los derechos reservados</p>
  </footer>

  <script src="js/main.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/filters.js"></script>
<script type="module" src="js/carrito-animado.js"></script>
<script src="js/efecto-luces.js"></script>
</body>
</html>
