<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catálogo — Autoservice Liam Yahir</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- header (misma estructura que index) -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo/logo.png" alt="Autoservice Liam Yahir" class="brand-logo">
        <span class="brand-title">Autoservice Liam Yahir</span>
      </a>
      <nav class="main-nav" role="navigation">
        <a href="index.html">Inicio</a>
        <a href="products.html">CATÁLOGO</a>
        <a href="delivery.html">Delivery</a>
        <button id="login-toggle" class="btn-link">Ingresar / Registrar</button>
      </nav>
      <div class="header-actions">
        <button id="cart-toggle" class="cart-toggle">
          <span class="cart-icon">🛒</span>
          <span id="cart-count" class="cart-count">0</span>
        </button>
        <a class="whatsapp-float" href="https://wa.me/59892308828" target="_blank">
          <img src="images/icons/whatsapp-icon.png" alt="WhatsApp">
        </a>
      </div>
    </div>
  </header>

  <div id="mouse-light"></div>

  <main style="max-width:1200px;margin:20px auto;display:flex;gap:18px;padding:0 12px;">
    <!-- Filters -->
    <aside id="filters-panel" style="width:280px;"></aside>

    <!-- Product grid -->
    <section style="flex:1;">
      <h2 class="section-title" style="color:#fff">Catálogo Completo</h2>
      <div id="productos" aria-live="polite"></div>
    </section>
  </main>

  <!-- cart panel, modals (reuse same markup as index) -->
  <aside id="cart-panel" aria-hidden="true">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;">
      <h3 style="margin:0;color:#fff">Tu carrito</h3>
      <button id="cart-close">✕</button>
    </div>
    <div id="cart-items" style="padding:8px"></div>
  </aside>

  <div id="auth-modal" class="modal" aria-hidden="true" style="display:none">...<!-- same structure as index; omit for brevity --></div>
  <div id="checkout-modal" class="modal" aria-hidden="true" style="display:none">...</div>
  <div id="dashboard-modal" class="modal" aria-hidden="true" style="display:none">...</div>

  <!-- scripts -->
  <script defer src="js/config.js"></script>
<script defer src="js/init-app.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/render-helper.js"></script>
<script defer src="js/filters.js"></script>
<script defer src="js/cart-ui.js"></script>
<script defer src="js/auth-and-checkout.js"></script>
<script defer src="js/dashboard.js"></script>

  <script>
    // Iniciar filtros y cargar productos
    document.addEventListener("DOMContentLoaded", async ()=> {
      await initFilters(); // defined in js/filters.js (uses window.obtenerProductos)
    });
  </script>
</body>
</html>
