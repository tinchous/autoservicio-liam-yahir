<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Cuenta - AutoService Liam & Yahir</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<script src="js/config.js"></script>
<script src="js/users.js"></script>
</head>
<body>
<header class="header-bar">
  <div class="logo-area">
    <img src="images/logo.png" alt="Autoservice Liam-Yahir" class="logo-mini">
    <h1>Autoservice <span>Liam-Yahir</span></h1>
  </div>
  <nav class="nav-menu">
    <a href="index.html">Inicio</a>
    <a href="products.html" class="activo">Catálogo</a>
    <a href="delivery.html">Delivery</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>
    <a href="login.html" class="login-link">Ingresar / Registrar</a>
  </nav>
</header>

<main class="container">
  <h1>👤 Mi Cuenta</h1>
  <div id="user-info"></div>
</main>

<footer>
  <p>© 2025 AutoService Liam & Yahir</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const user = getActiveUser();
  const div = document.getElementById('user-info');
  if (!user) {
    div.innerHTML = '<p>Debes iniciar sesión para ver tu perfil.</p>';
    return;
  }
  div.innerHTML = `
    <h3>${user.nombre}</h3>
    <p><b>Email:</b> ${user.email}</p>
    <p><b>Teléfono:</b> ${user.telefono}</p>
    <p><b>Dirección:</b> ${user.direccion}</p>
    <p><b>Registrado:</b> ${user.fechaRegistro}</p>
    <button onclick="logoutUser()">Cerrar sesión</button>
  `;
});
</script>
<script src="js/efecto-luces.js"></script>

</body>
</html>
